version: 2

updates:
  # Keep the action SHAs current. Without this, pinning to a commit means the
  # actions silently freeze at whatever version was pinned, security fixes
  # included. Dependabot reads the trailing "# v4" comment and bumps both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # A dependency goes in the first group it matches, so React's comes first and
    # takes its type packages with it
    groups:
      # React refuses to run unless react and react-dom are the exact same
      # version, so a bump of one alone fails the build: they move in one PR
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # One PR for the toolchain rather than a stream of them
      dev-dependencies:
        dependency-type: development
