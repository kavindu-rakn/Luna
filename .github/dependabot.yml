version: 2

updates:
  # Keep the action SHAs current. Without this, pinning to a commit means the
  # actions silently freeze at whatever version was pinned, security fixes
  # included. Dependabot reads the trailing "# v4" comment and bumps both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # One PR for the toolchain rather than a stream of them
      dev-dependencies:
        dependency-type: development
      # Three.js, drei and fiber move together and break apart
      three-stack:
        patterns:
          - "three"
          - "@react-three/*"
          - "three-stdlib"
