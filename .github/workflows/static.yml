# Verify, then deploy to GitHub Pages.
#
# Actions are pinned to commit SHAs rather than moving tags. A tag like @v4 can be
# repointed at any commit by whoever controls the action, and this workflow holds
# pages:write and id-token:write, so a repointed tag would be a direct supply-chain
# route into a production deploy. The trailing comment keeps the version readable
# and lets Dependabot bump both together.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Least privilege at the top; the deploy job widens it for itself only.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins and fails if the two
      # have drifted. npm install would silently resolve new transitive versions
      # straight into a production deploy.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The 3D engine must stay lazy and the entry within budget. This is what
      # stops a stray eager import undoing the split without anyone noticing.
      - name: First-paint budget
        run: npm run check:bundle

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
