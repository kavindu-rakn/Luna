# Gate on pull requests and on any branch push.
#
# Before this existed the only workflow was the deploy, so nothing checked a change
# until it was already on master and on its way to production.
name: CI

# pull_request only. Adding a push trigger as well made every job run twice for
# any PR raised from a branch in this repo: once for the branch push, once for the
# PR. Direct pushes to master are still verified, by the lint and test steps in
# the deploy workflow.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The suite runs under TZ=Asia/Colombo by design. A UTC runner would let a
      # timezone regression pass unnoticed, which is exactly how the original bug
      # survived: every displayed time was rendered on the viewer's clock.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Always print the full picture, including dev dependencies, so a reviewer
      # can see what changed even when the gate passes.
      - name: Report all advisories
        run: npm audit || true

      # Only anything reachable by a visitor fails the build. Dev-tree advisories
      # are reported above but do not block: they cannot reach production, and
      # blocking on them trains people to ignore the gate.
      - name: Fail on production advisories
        run: npm audit --omit=dev --audit-level=moderate
